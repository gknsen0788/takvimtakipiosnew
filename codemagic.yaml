# Codemagic CI/CD Pipeline for TakvimTakip iOS
# Documentation: https://docs.codemagic.io/yaml-quick-start/building-a-native-ios-app/

workflows:
  ios-app-store:
    name: TakvimTakip iOS Build & Deploy
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: takvimtakip_api_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.takvimtakip.app2026
      vars:
        XCODE_PROJECT: "ios/TakvimTakip.xcodeproj"
        XCODE_SCHEME: "TakvimTakip"
      xcode: latest
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_testing: false
