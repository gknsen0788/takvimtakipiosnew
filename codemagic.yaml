# Codemagic CI/CD Pipeline for TakvimTakip iOS
# Documentation: https://docs.codemagic.io/yaml-quick-start/building-a-native-ios-app/

workflows:
  ios-app-store:
    name: TakvimTakip iOS Build & Deploy
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: takvimtakip_api_key
    environment:
      groups:
        - certificates
      vars:
        XCODE_PROJECT: "ios/TakvimTakip.xcodeproj"
        XCODE_SCHEME: "TakvimTakip"
        BUNDLE_ID: "com.takvimtakip.app2026"
      xcode: latest
    scripts:
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch and create code signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" || (echo "=== XCODEBUILD LOG DUMP ===" && cat /tmp/xcodebuild_logs/*.log 2>/dev/null && exit 1)
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
